  - general logical candidacy and finite-backend rejection remain visibly separate
exclusions:
  - native surgery rounds, duration, or physical simultaneity
  - finite processor placement, memory, routing, reaction, or decoder service
  - CCZ factory delivery, buffering, storage, or stall trajectories
