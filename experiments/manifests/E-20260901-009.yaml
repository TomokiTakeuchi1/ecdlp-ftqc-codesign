determinism:
  random_seed: not_applicable_deterministic_symbolic_analysis
  relation_algebra: exact canonical Boolean ANF
  batching: lexicographically deterministic maximum compatible ready subsets
validation:
  - all 43 IP source operations map once to the shared PPM/frame IR
  - all 20 direct-CCZ events retain six PPMs and six correction updates
  - all 75 source dependencies and 18 frame boundaries replay independently
  - all 1024 width-5 basis input pairs replay the IP arithmetic contract
  - all 7140 PPM pairs receive exact commutation, axis, causal, reaction, and resource certificates
  - the 24-level construction meets the exact 24-level causal lower bound
  - seven large-frame weight fields are visibly conservative bounds and do not affect compatibility
  - finite schedule, runtime, physical qubits, and failure probability remain null
exclusions:
  - width scaling or width-256 extrapolation
  - native surgery rounds or operation duration
  - finite processor placement, memory traffic, routing, or capacity admission
  - decoder throughput or classical reaction time
  - CCZ delivery, buffering, storage trajectory, or stalls
  - physical qubit total or logical failure probability
