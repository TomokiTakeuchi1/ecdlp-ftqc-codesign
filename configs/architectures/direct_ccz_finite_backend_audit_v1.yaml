schema: ecdlp-ftqc/direct-ccz-backend-audit
schema_version: 1
audit_id: finite-direct-ccz-backend-audit-v1
task_id: T-20260831-004
recorded_backend_admitted: false

required_fields:
  - consumer.event_semantics
  - consumer.batch_size
  - consumer.parallel_ppm_layers
  - consumer.duration_rounds
  - consumer.logical_error_per_batch
  - controller.decoder_throughput
