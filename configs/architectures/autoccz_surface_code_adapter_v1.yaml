      source_ids: ["Gidney and Fowler, arXiv:1905.08916v1"]
      compatibility_domain: gidney-fowler-autoccz-surface-code-d17-d27-v1
      note: The 10-us reaction time is an explicit plausible-future-hardware assumption, not a demonstrated controller bound.
    - field_id: processor.injection_port_capacity
