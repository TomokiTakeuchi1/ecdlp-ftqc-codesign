sources:
  - source_id: "Gidney and Fowler, arXiv:1905.08916v1"
    local_pdf: literature/papers/1905.08916v1.pdf
    pdf_sha256: 9AF4F54C34DABED47DBC915BD2EA52D55BCE7B48E8D19BCD896376920A5E718B
    pages: [1, 4, 5, 6, 7, 8, 11, 14]
    establishes:
      - AutoCCZ embeds three delayed-choice CZ fixups and uses six routing qubits so no CZ correction is performed at the consumption site.
      - The source-native layout links a CCZ factory output to a fixup box while routing the state to a Toffoli consumer.
      - Under the stated d1=17, d2=27, 1-us cycle, and 10-us reaction example, the level-2 factory rate is approximately 7.4 kHz and fourteen factories meet a 100-kHz average reaction-limited demand.
    evidence_status: LITERATURE
  - source_id: "Gidney and Fowler, arXiv:1812.01238v3"
    local_pdf: literature/papers/1812.01238v3.pdf
    pdf_sha256: C5F8A0D73C8C18D44CD86961760157CA8E261BF03382365C4AC8B8CFAF99594D
    pages: [1, 2, 3, 6, 7, 8, 9, 11, 12]
    establishes:
      - The base surface-code lattice-surgery factory emits one CCZ state every 5.5d cycles before the AutoCCZ paper's 5d improvement.
      - The official d1=15 and d2=31 calculator estimates CCZ output error 5.33332e-11 at physical error 1e-3.
      - The paper discusses routing bottlenecks and qualitative surplus level-1 T-state storage but does not give a finite output-CCZ buffer service contract.
    evidence_status: LITERATURE

