  compatibility_domain: gidney-fowler-autoccz-surface-code-d17-d27-v1
  evidence_status: OPEN
  conclusion: The source-native factory-to-consumer adapter is qualified, but the complete service is rejected because nine finite service fields remain absent and the only calculator-backed output-error value belongs to d1=15/d2=31 rather than the selected d1=17/d2=27 AutoCCZ example.
  fields:
    - field_id: consumer.event_semantics
      reported_value: AutoCCZ Figure 4/6 Toffoli consumption with three delayed-choice CZ corrections and Pauli-frame updates
      admitted_value: autoccz-three-delayed-cz-toffoli-consumption-v1
      unit: logical_event_contract
      evidence_status: LITERATURE
      source_ids: ["Gidney and Fowler, arXiv:1905.08916v1"]
      compatibility_domain: gidney-fowler-autoccz-surface-code-d17-d27-v1
      note: The logical channel is independently checked after treating each source-proved delayed-choice cell as CZ or identity; the lattice-surgery realization remains literature evidence.
    - field_id: consumer.resource_type
      reported_value: one CCZ state augmented by three delayed-choice CZ cells using six routing qubits
      admitted_value: one-AutoCCZ-state-with-six-routing-qubits
      unit: resource_state_contract
      evidence_status: LITERATURE
      source_ids: ["Gidney and Fowler, arXiv:1905.08916v1"]
      compatibility_domain: gidney-fowler-autoccz-surface-code-d17-d27-v1
      note: The source explicitly reports two routing qubits for each of three possible CZ fixups.
    - field_id: consumer.consumption_interval_cycles
      reported_value: "10"
      admitted_value: null
      unit: surface_code_cycles_per_serial_dependency
      evidence_status: CHECK
      source_ids: ["Gidney and Fowler, arXiv:1905.08916v1"]
      compatibility_domain: gidney-fowler-autoccz-surface-code-d17-d27-v1
      note: Ten cycles follows only from the paper's assumed 10-us reaction and 1-us cycle; it is not a decoded consumer-duration bound.
    - field_id: consumer.logical_error_per_event
      reported_value: null
      admitted_value: null
      unit: probability_per_AutoCCZ_consumption
      evidence_status: OPEN
      source_ids: []
      compatibility_domain: gidney-fowler-autoccz-surface-code-d17-d27-v1
      note: No integrated d1=17/d2=27 error covers factory output, routing, delayed-choice measurements, and data-patch consumption.
    - field_id: controller.decoder_throughput
      reported_value: null
      admitted_value: null
      unit: detection_events_per_second
      evidence_status: OPEN
      source_ids: []
      compatibility_domain: gidney-fowler-autoccz-surface-code-d17-d27-v1
